<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Connect to Mikrotik - Hotspot Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd; /* Borrowed from dashboard */
            --danger-color: #dc3545;  /* Borrowed from dashboard */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Borrowed from dashboard */
            --border-radius: 0.375rem; /* Borrowed from dashboard */
        }
        body {
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5; /* Light gray background */
            margin: 0;
            padding: 1rem; /* Add padding for smaller screens */
        }
        .login-container {
            background: #fff;
            padding: 2rem 2.5rem; /* Adjusted padding */
            border-radius: var(--border-radius);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px; /* Max width for the container */
        }
        .login-container h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem; /* Slightly larger title */
        }
        .form-group {
            margin-bottom: 1.25rem; /* Adjusted margin */
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #495057; /* Darker label color */
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem; /* Adjusted padding */
            border: 1px solid #ced4da;
            border-radius: var(--border-radius);
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, .25); /* Focus ring */
        }
        .login-button { /* Changed class name for clarity */
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem; /* Slightly larger button text */
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .login-button:hover {
            background-color: #0b5ed7; /* Darker shade on hover */
        }
        .login-button .fas { /* For potential icon in button */
            font-size: 1rem;
        }
        #errorMessage { /* Will now use .alert classes */
            /*
            color: var(--danger-color);
            background-color: #f8d7da; 
            border: 1px solid #f5c2c7; 
            */
            border-radius: var(--border-radius);
            padding: 0.75rem 1rem;
            margin-top: 1.5rem;
            text-align: center;
            display: none; /* Hidden by default */
            font-size: 0.9rem;
        }
        .alert { /* General alert styling */
            padding: 0.75rem 1rem;
            margin-top: 1.5rem;
            border: 1px solid transparent;
            border-radius: var(--border-radius);
            text-align: center;
            /* display: none; -- will be controlled by JS adding/removing class or direct style.display */
            font-size: 0.9rem;
        }
        .alert-danger {
            color: #842029;
            background-color: #f8d7da;
            border-color: #f5c2c7;
        }
        .alert-success {
            color: #0f5132;
            background-color: #d1e7dd;
            border-color: #badbcc;
        }
         .loading-spinner { /* Copied from dashboard for consistency */
            display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em;
            border: .2em solid currentColor; border-right-color: transparent;
            border-radius: 50%; animation: spinner-border .75s linear infinite;
        }
        @keyframes spinner-border { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Web App Login Form -->
        <div id="appLoginSection">
            <h2>Hotspot Manager Login</h2>
            <form id="appLoginForm">
                <div class="form-group">
                    <label for="appUsername">Admin Username</label>
                    <input type="text" id="appUsername" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label for="appPassword">Admin Password</label>
                    <input type="password" id="appPassword" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="login-button">
                    <i class="fas fa-sign-in-alt"></i> Login to App
                </button>
                <div id="appErrorMessage" class="alert" style="display: none;"></div>
            </form>
        </div>

        <!-- Mikrotik Connection Form (Initially Hidden) -->
        <div id="mikrotikLoginSection" style="display: none;">
            <h2>Connect to Mikrotik Router</h2>
            <form id="mikrotikLoginForm"> <!-- Changed ID -->
                <div class="form-group">
                    <label for="routerHost">Router IP Address</label>
                <input type="text" id="routerHost" placeholder="e.g., 192.168.88.1" required value="192.168.88.1">
            </div>
            <div class="form-group">
                <label for="routerPort">API Port</label>
                <input type="number" id="routerPort" placeholder="e.g., 8728" required value="8728">
            </div>
            <div class="form-group">
                <label for="routerUsername">Username</label>
                <input type="text" id="routerUsername" placeholder="e.g., admin" required value="admin">
            </div>
            <div class="form-group">
                <label for="routerPassword">Password</label>
                <input type="password" id="routerPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-button">
                <i class="fas fa-plug"></i> Connect to Router
            </button>
            <div id="mikrotikErrorMessage" class="alert" style="display: none;"></div> <!-- Changed ID -->
            </form>
        </div>
    </div>

    <script>
        // Translations object (populated by /api/translations)
        let i18n = {};

        // Function to get translated string
        function _(key, ...args) {
            let translation = i18n[key] || key;
            if (args.length > 0) {
                args.forEach((arg, index) => {
                    translation = translation.replace(new RegExp(`\\{${index}\\}`, 'g'), arg);
                });
            }
            return translation;
        }

        // Fetch translations first
        async function fetchTranslations() {
            try {
                const response = await fetch('/api/translations'); // This is a GET, no CSRF needed
                if (!response.ok) {
                    console.error('Failed to load translations:', response.status);
                    return;
                }
                i18n = await response.json();
            } catch (error) {
                console.error('Error fetching translations:', error);
            }
        }

        // Function to get CSRF token from meta tag
        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        }

        // App Login Form Handler
        document.getElementById('appLoginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const csrfToken = getCsrfToken(); // Get CSRF token
            const username = document.getElementById('appUsername').value;
            const password = document.getElementById('appPassword').value;
            const appErrorMessageDiv = document.getElementById('appErrorMessage');
            const appLoginButton = this.querySelector('button[type="submit"]');
            const originalButtonHTML = appLoginButton.innerHTML;

            appErrorMessageDiv.textContent = '';
            appErrorMessageDiv.style.display = 'none';
            appErrorMessageDiv.className = 'alert';

            if (!username || !password) {
                appErrorMessageDiv.textContent = _('Username and password are required.'); // Example of using _
                appErrorMessageDiv.className = 'alert alert-danger';
                appErrorMessageDiv.style.display = 'block';
                return;
            }

            appLoginButton.disabled = true;
            appLoginButton.innerHTML = `<span class="loading-spinner"></span> ${_('Connecting...')}`;

            fetch('/app-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': csrfToken // Add CSRF token to header
                },
                body: new URLSearchParams({ app_username: username, app_password: password })
            })
            .then(response => response.json().then(data => ({ ok: response.ok, status: response.status, data })))
            .then(({ ok, status, data }) => {
                if (ok && data.success) {
                    appErrorMessageDiv.textContent = data.message || _('Successfully connected! Redirecting...');
                    appErrorMessageDiv.className = 'alert alert-success';
                    appErrorMessageDiv.style.display = 'block';
                    // Hide app login, show Mikrotik login
                    document.getElementById('appLoginSection').style.display = 'none';
                    document.getElementById('mikrotikLoginSection').style.display = 'block';
                    // Potentially fetch Mikrotik config if needed here, or dashboard will handle it
                } else {
                    appErrorMessageDiv.textContent = data.message || _('Connection failed (Error {0}). Please check details and try again.', status);
                    appErrorMessageDiv.className = 'alert alert-danger';
                    appErrorMessageDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error during app login fetch:', error);
                appErrorMessageDiv.textContent = _('Network error or server is unreachable.');
                appErrorMessageDiv.className = 'alert alert-danger';
                appErrorMessageDiv.style.display = 'block';
            })
            .finally(() => {
                // Only restore button if not successful
                if (!appErrorMessageDiv.classList.contains('alert-success')) {
                     appLoginButton.disabled = false;
                     appLoginButton.innerHTML = originalButtonHTML;
                }
            });
        });

        // Mikrotik Login Form Handler (Original functionality, adapted)
        document.getElementById('mikrotikLoginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const csrfToken = getCsrfToken(); // Get CSRF token

            const host = document.getElementById('routerHost').value;
            const port = document.getElementById('routerPort').value;
            const username = document.getElementById('routerUsername').value;
            const password = document.getElementById('routerPassword').value;
            const mikrotikErrorMessageDiv = document.getElementById('mikrotikErrorMessage'); // Changed ID
            const connectButton = this.querySelector('button[type="submit"]');
            const originalButtonHTML = connectButton.innerHTML;

            mikrotikErrorMessageDiv.textContent = '';
            mikrotikErrorMessageDiv.style.display = 'none';
            mikrotikErrorMessageDiv.className = 'alert';

            if (!host || !port || !username) {
                mikrotikErrorMessageDiv.textContent = _('Router IP, Port, and Username are required.');
                mikrotikErrorMessageDiv.className = 'alert alert-danger';
                mikrotikErrorMessageDiv.style.display = 'block';
                return;
            }
            if (parseInt(port) <= 0 || parseInt(port) > 65535) {
                 mikrotikErrorMessageDiv.textContent = _('Please enter a valid port number (1-65535).');
                 mikrotikErrorMessageDiv.className = 'alert alert-danger';
                 mikrotikErrorMessageDiv.style.display = 'block';
                return;
            }

            connectButton.disabled = true;
            connectButton.innerHTML = `<span class="loading-spinner"></span> ${_('Connecting...')}`;

            fetch('/api/initial-connect', { // This endpoint now assumes app is already logged in
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken // Add CSRF token to header
                },
                body: JSON.stringify({ host, port: parseInt(port), username, password }),
            })
            .then(response => response.json().then(data => ({ ok: response.ok, status: response.status, data })))
            .then(({ ok, status, data }) => {
                if (ok && data.success) {
                    mikrotikErrorMessageDiv.textContent = data.message || _('Successfully connected! Redirecting...');
                    mikrotikErrorMessageDiv.className = 'alert alert-success';
                    mikrotikErrorMessageDiv.style.display = 'block';
                    window.location.href = '/dashboard';
                } else {
                    mikrotikErrorMessageDiv.textContent = data.message || _('Connection failed (Error {0}). Please check details and try again.', status);
                    mikrotikErrorMessageDiv.className = 'alert alert-danger';
                    mikrotikErrorMessageDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error during Mikrotik connect fetch:', error);
                mikrotikErrorMessageDiv.textContent = _('Network error or server is unreachable.');
                mikrotikErrorMessageDiv.className = 'alert alert-danger';
                mikrotikErrorMessageDiv.style.display = 'block';
            })
            .finally(() => {
                if (!mikrotikErrorMessageDiv.classList.contains('alert-success')) {
                    connectButton.disabled = false;
                    connectButton.innerHTML = originalButtonHTML;
                }
            });
        });

        // Initialize translations on page load
        document.addEventListener('DOMContentLoaded', fetchTranslations);
    </script>
</body>
</html>
